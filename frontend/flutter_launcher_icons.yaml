flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon_full.png"
  min_sdk_android: 21
  adaptive_icon_background: "#3D0B1A"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icons/app_icon_monochrome.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon_full.png"
    background_color: "#3D0B1A"
    theme_color: "#3D0B1A"
