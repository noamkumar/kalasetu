name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-web.yml'
      - 'vercel.json'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API Base URL'
        required: false
        default: 'https://kalasetu-backend-s3uq.onrender.com/api/v1'

jobs:
  build-and-deploy:
    name: Build & Deploy Web
    runs-on: ubuntu-latest

    env:
      API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://kalasetu-backend-s3uq.onrender.com/api/v1' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Vercel Secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret VERCEL_TOKEN is not configured in GitHub repository secrets."
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::Secret VERCEL_ORG_ID is not configured in GitHub repository secrets."
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Secret VERCEL_PROJECT_ID is not configured in GitHub repository secrets."
            exit 1
          fi
          echo "Verified required Vercel repository secrets are present."

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Flutter Web (Release)
        working-directory: frontend
        run: |
          flutter build web --release --no-tree-shake-icons --dart-define=API_BASE_URL="${{ env.API_BASE_URL }}"

      - name: Verify Web Build Artifacts
        run: |
          if [ ! -f "frontend/build/web/index.html" ]; then
            echo "::error::Flutter web build output not found at frontend/build/web/index.html"
            exit 1
          fi
          echo "Verified frontend/build/web contains index.html"
          ls -la frontend/build/web

      - name: Prepare Vercel Static Bundle
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Copy vercel.json into the web build directory for SPA rewrites and security headers
          cp frontend/vercel.json frontend/build/web/vercel.json

          # Write Vercel project linkage to target existing project across all potential lookup roots
          node -e "
            const fs = require('fs');
            const projectConfig = JSON.stringify({
              orgId: process.env.VERCEL_ORG_ID || '',
              projectId: process.env.VERCEL_PROJECT_ID || ''
            }, null, 2);
            for (const dir of ['.vercel', 'frontend/.vercel', 'frontend/build/web/.vercel']) {
              fs.mkdirSync(dir, { recursive: true });
              fs.writeFileSync(dir + '/project.json', projectConfig);
            }
          "

          # Fallback link to handle Vercel CLI rootDirectory 'frontend' resolution inside bundle
          ln -sf . frontend/build/web/frontend || true

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy frontend/build/web --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
