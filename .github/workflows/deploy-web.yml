name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-web.yml'
      - 'vercel.json'
      - '.vercelignore'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API Base URL'
        required: false
        default: 'https://kalasetu-backend-s3uq.onrender.com/api/v1'

jobs:
  build-and-deploy:
    name: Build & Deploy Web
    runs-on: ubuntu-latest

    env:
      API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://kalasetu-backend-s3uq.onrender.com/api/v1' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Vercel Secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret VERCEL_TOKEN is not configured in GitHub repository secrets."
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::Secret VERCEL_ORG_ID is not configured in GitHub repository secrets."
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Secret VERCEL_PROJECT_ID is not configured in GitHub repository secrets."
            exit 1
          fi
          echo "Verified required Vercel repository secrets are present."

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Flutter Web (Release)
        working-directory: frontend
        run: |
          flutter build web --release --no-tree-shake-icons --dart-define=API_BASE_URL="${{ env.API_BASE_URL }}"

      - name: Verify Web Build Artifacts
        run: |
          if [ ! -f "frontend/build/web/index.html" ]; then
            echo "::error::Flutter web build output not found at frontend/build/web/index.html"
            exit 1
          fi
          echo "Verified frontend/build/web contains index.html"
          ls -la frontend/build/web

      - name: Inspect Vercel Project Settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node -e "
            const https = require('https');
            const orgId = process.env.VERCEL_ORG_ID || '';
            const projectId = process.env.VERCEL_PROJECT_ID || '';
            const token = process.env.VERCEL_TOKEN || '';
            const teamQuery = orgId.startsWith('team_') ? '?teamId=' + orgId : '';
            const options = {
              hostname: 'api.vercel.com',
              path: '/v9/projects/' + projectId + teamQuery,
              headers: { Authorization: 'Bearer ' + token }
            };
            https.get(options, res => {
              let body = '';
              res.on('data', chunk => body += chunk);
              res.on('end', () => {
                if (res.statusCode >= 200 && res.statusCode < 300) {
                  const data = JSON.parse(body);
                  console.log('=== Vercel Remote Project Settings ===');
                  console.log('Project Name:    ', data.name);
                  console.log('Project ID:      ', data.id);
                  console.log('Root Directory:  ', JSON.stringify(data.rootDirectory));
                  console.log('Framework:       ', JSON.stringify(data.framework));
                  console.log('Build Command:   ', JSON.stringify(data.buildCommand));
                  console.log('Output Directory:', JSON.stringify(data.outputDirectory));
                  console.log('======================================');
                } else {
                  console.log('Vercel project inspection HTTP status: ' + res.statusCode);
                }
              });
            }).on('error', err => console.log('Inspection request notice:', err.message));
          "

      - name: Prepare Vercel Static Bundle
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Copy vercel.json into the web build directory
          cp frontend/vercel.json frontend/build/web/vercel.json

          # Populate frontend root with build artifacts for Vercel rootDirectory 'frontend' resolution
          cp -r frontend/build/web/* frontend/

          # Verify deployed root contains index.html and vercel.json
          if [ ! -f "frontend/index.html" ] || [ ! -f "frontend/vercel.json" ]; then
            echo "::error::frontend root missing index.html or vercel.json"
            exit 1
          fi
          echo "Verified frontend contains index.html and vercel.json"
          ls -la frontend/index.html frontend/vercel.json

          # Write single canonical Vercel project configuration at repository root
          node -e "
            const fs = require('fs');
            const projectConfig = JSON.stringify({
              orgId: process.env.VERCEL_ORG_ID || '',
              projectId: process.env.VERCEL_PROJECT_ID || ''
            }, null, 2);
            fs.mkdirSync('.vercel', { recursive: true });
            fs.writeFileSync('.vercel/project.json', projectConfig);
          "

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
